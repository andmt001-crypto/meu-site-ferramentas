<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Roda da Sorte</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: white;
            margin-bottom: 10px;
        }

        .subtitulo {
            color: #aaa;
            margin-bottom: 30px;
        }

        /* Canvas da roda */
        canvas {
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            cursor: pointer;
        }

        /* Botão girar */
        button {
            background: #ff0000;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 10px;
        }

        button:hover {
            transform: scale(1.05);
            background: #cc0000;
        }

        .btn-reset {
            background: #333;
        }

        .btn-reset:hover {
            background: #444;
        }

        /* Resultado */
        .resultado {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
        }

        .resultado span {
            font-size: 24px;
            font-weight: bold;
            color: #ff0000;
        }

        /* Personalização */
        .personalizar {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
        }

        .personalizar h3 {
            color: white;
            margin-bottom: 15px;
        }

        .personalizar input {
            padding: 10px;
            width: 200px;
            border-radius: 8px;
            border: none;
            margin: 5px;
        }

        .personalizar button {
            padding: 10px 20px;
            font-size: 14px;
        }

        .lista-opcoes {
            margin: 15px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .opcao-tag {
            background: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        .opcao-tag:hover {
            background: #ff0000;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎡 Roda da Sorte</h1>
        <div class="subtitulo">Clique na roda ou no botão para girar</div>

        <canvas id="rodaCanvas" width="400" height="400"></canvas>
        <br>
        <button onclick="girarRoda()">🎲 Girar Roda</button>
        <button class="btn-reset" onclick="resetarRoda()">🔄 Resetar</button>

        <div class="resultado" id="resultado">
            🎉 Resultado: <span id="resultadoTexto">Clique para girar</span>
        </div>

        <div class="personalizar">
            <h3>✏️ Personalizar Opções</h3>
            <div class="lista-opcoes" id="listaOpcoes"></div>
            <input type="text" id="novaOpcao" placeholder="Nova opção (ex: Pizza)">
            <button onclick="adicionarOpcao()">➕ Adicionar</button>
            <button onclick="removerUltima()">➖ Remover última</button>
        </div>

        <footer>
            💡 Dica: Clique nos itens acima para removê-los<br>
            Personalize com suas próprias opções!
        </footer>
    </div>

    <script>
        // Opções padrão da roda
        let opcoes = [
            "🍕 Pizza", "🍔 Hambúrguer", "🍣 Sushi", "🥗 Salada", 
            "🍝 Macarrão", "🥘 Feijoada", "🌮 Taco", "🥩 Churrasco"
        ];

        let anguloAtual = 0;
        let girando = false;
        let animacaoId = null;

        const canvas = document.getElementById('rodaCanvas');
        const ctx = canvas.getContext('2d');
        const tamanho = 400;
        const centro = tamanho / 2;
        const raio = tamanho / 2 - 10;

        // Cores vibrantes
        const cores = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4',
            '#FFEAA7', '#DDA0DD', '#98D8C8', '#F7B05E',
            '#E86A6A', '#6A9C89', '#C9A66B', '#7C9EB2'
        ];

        function desenharRoda() {
            if (opcoes.length === 0) {
                ctx.fillStyle = '#333';
                ctx.fillRect(0, 0, tamanho, tamanho);
                ctx.fillStyle = 'white';
                ctx.font = '16px Arial';
                ctx.fillText('Adicione opções', centro - 70, centro);
                return;
            }

            const anguloPorOpcao = (Math.PI * 2) / opcoes.length;
            
            for (let i = 0; i < opcoes.length; i++) {
                const inicio = anguloAtual + i * anguloPorOpcao;
                const fim = inicio + anguloPorOpcao;
                
                // Desenha fatia
                ctx.beginPath();
                ctx.arc(centro, centro, raio, inicio, fim);
                ctx.lineTo(centro, centro);
                ctx.fillStyle = cores[i % cores.length];
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Desenha texto
                ctx.save();
                ctx.translate(centro, centro);
                ctx.rotate(inicio + anguloPorOpcao / 2);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'white';
                ctx.font = 'bold 14px Arial';
                ctx.shadowBlur = 0;
                
                let texto = opcoes[i];
                if (texto.length > 12) texto = texto.substring(0, 10) + '...';
                ctx.fillText(texto, raio * 0.65, 5);
                ctx.restore();
            }
            
            // Desenha o círculo central
            ctx.beginPath();
            ctx.arc(centro, centro, 20, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.fillStyle = '#333';
            ctx.font = 'bold 20px Arial';
            ctx.fillText('🎯', centro - 12, centro + 8);
        }

        function girarRoda() {
            if (girando) return;
            
            girando = true;
            const giros = 10 + Math.random() * 10; // Número de giros completos
            const anguloFinal = anguloAtual + (Math.PI * 2 * giros) + (Math.random() * Math.PI * 2);
            
            const inicio = performance.now();
            const duracao = 2000; // 2 segundos
            
            function animar(agora) {
                const elapsed = agora - inicio;
                const progresso = Math.min(1, elapsed / duracao);
                
                // Easing: desacelera no final
                const easeOut = 1 - Math.pow(1 - progresso, 3);
                anguloAtual = anguloAtual + (anguloFinal - anguloAtual) * easeOut;
                
                desenharRoda();
                
                if (progresso < 1) {
                    animacaoId = requestAnimationFrame(animar);
                } else {
                    anguloAtual = anguloFinal % (Math.PI * 2);
                    desenharRoda();
                    girando = false;
                    cancelAnimationFrame(animacaoId);
                    mostrarResultado();
                }
            }
            
            if (animacaoId) cancelAnimationFrame(animacaoId);
            animacaoId = requestAnimationFrame(animar);
        }
        
        function mostrarResultado() {
            if (opcoes.length === 0) {
                document.getElementById('resultadoTexto').innerText = 'Adicione opções primeiro!';
                return;
            }
            
            const anguloPorOpcao = (Math.PI * 2) / opcoes.length;
            // O ponteiro está no topo (ângulo -PI/2)
            let anguloPonteiro = (anguloAtual + Math.PI / 2) % (Math.PI * 2);
            let index = Math.floor(anguloPonteiro / anguloPorOpcao);
            index = (opcoes.length - index) % opcoes.length;
            
            const resultado = opcoes[index];
            document.getElementById('resultadoTexto').innerHTML = resultado;
            
            // Efeito de confete simples
            if (resultado) {
                const resultadoDiv = document.getElementById('resultado');
                resultadoDiv.style.animation = 'pulse 0.5s';
                setTimeout(() => {
                    resultadoDiv.style.animation = '';
                }, 500);
            }
        }
        
        function resetarRoda() {
            if (girando) return;
            anguloAtual = 0;
            desenharRoda();
            document.getElementById('resultadoTexto').innerHTML = 'Clique para girar';
        }
        
        function adicionarOpcao() {
            const input = document.getElementById('novaOpcao');
            const novo = input.value.trim();
            if (novo && !opcoes.includes(novo)) {
                opcoes.push(novo);
                input.value = '';
                atualizarListaOpcoes();
                resetarRoda();
            } else if (novo && opcoes.includes(novo)) {
                alert('Essa opção já existe!');
            } else {
                alert('Digite uma opção válida!');
            }
        }
        
        function removerUltima() {
            if (opcoes.length > 1) {
                opcoes.pop();
                atualizarListaOpcoes();
                resetarRoda();
            } else {
                alert('Você precisa ter pelo menos uma opção!');
            }
        }
        
        function removerOpcao(index) {
            if (opcoes.length > 1) {
                opcoes.splice(index, 1);
                atualizarListaOpcoes();
                resetarRoda();
            } else {
                alert('Você precisa ter pelo menos uma opção!');
            }
        }
        
        function atualizarListaOpcoes() {
            const container = document.getElementById('listaOpcoes');
            container.innerHTML = '';
            opcoes.forEach((op, idx) => {
                const tag = document.createElement('span');
                tag.className = 'opcao-tag';
                tag.innerHTML = op + ' ✖';
                tag.onclick = () => removerOpcao(idx);
                container.appendChild(tag);
            });
            desenharRoda();
        }
        
        // Adiciona animação de pulse no CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0% { transform: scale(1); background: rgba(255,0,0,0); }
                50% { transform: scale(1.05); background: rgba(255,0,0,0.2); }
                100% { transform: scale(1); background: rgba(255,0,0,0); }
            }
        `;
        document.head.appendChild(style);
        
        // Inicializar
        atualizarListaOpcoes();
        desenharRoda();
        
        // Girar com clique na roda
        canvas.addEventListener('click', girarRoda);
    </script>
</body>
</html>
