<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Senhas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        /* Formulário para adicionar senha */
        .form-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: white;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff0000;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            background: #ff0000;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.02);
            background: #cc0000;
        }

        .btn-secundario {
            background: #333;
        }

        .btn-secundario:hover {
            background: #444;
        }

        /* Lista de senhas */
        .senhas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .senha-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s;
        }

        .senha-card:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.08);
        }

        .senha-site {
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .senha-username {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .senha-senha {
            background: #0f0f0f;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            color: #4CAF50;
            margin: 10px 0;
            word-break: break-all;
        }

        .senha-acoes {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .senha-acoes button {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }

        .btn-copiar {
            background: #2196F3;
        }

        .btn-copiar:hover {
            background: #0b7dda;
        }

        .btn-editar {
            background: #ff9800;
        }

        .btn-editar:hover {
            background: #e68900;
        }

        .btn-excluir {
            background: #f44336;
        }

        .btn-excluir:hover {
            background: #da190b;
        }

        .btn-mostrar {
            background: #9c27b0;
        }

        /* Busca */
        .busca {
            margin-bottom: 20px;
        }

        .busca input {
            width: 100%;
            padding: 12px;
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            font-size: 14px;
        }

        /* Estatísticas */
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat {
            background: rgba(255,255,255,0.05);
            padding: 10px 20px;
            border-radius: 10px;
        }

        .stat span {
            color: #ff0000;
            font-weight: bold;
            font-size: 20px;
        }

        .vazio {
            text-align: center;
            color: #666;
            padding: 50px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .fechar {
            cursor: pointer;
            font-size: 24px;
            color: white;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .senhas-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Gerenciador de Senhas</h1>
        <div class="subtitulo">Guarde suas senhas de forma segura (apenas no seu computador)</div>

        <!-- Formulário -->
        <div class="form-card">
            <form id="formSenha">
                <div class="form-group">
                    <label>🌐 Site / Serviço</label>
                    <input type="text" id="site" placeholder="Ex: Google, Facebook, Netflix..." required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>👤 Usuário / Email</label>
                        <input type="text" id="username" placeholder="seu@email.com">
                    </div>
                    <div class="form-group">
                        <label>🔑 Senha</label>
                        <input type="password" id="senha" placeholder="Digite ou gere uma senha">
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit">💾 Salvar Senha</button>
                    <button type="button" class="btn-secundario" onclick="gerarSenha()">🎲 Gerar Senha Forte</button>
                </div>
            </form>
        </div>

        <!-- Estatísticas -->
        <div class="stats" id="stats"></div>

        <!-- Busca -->
        <div class="busca">
            <input type="text" id="busca" placeholder="🔍 Buscar por site, usuário...">
        </div>

        <!-- Lista de senhas -->
        <div id="listaSenhas" class="senhas-grid"></div>
    </div>

    <!-- Modal de edição -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color: white;">✏️ Editar Senha</h3>
                <span class="fechar" onclick="fecharModal()">&times;</span>
            </div>
            <input type="hidden" id="editIndex">
            <div class="form-group">
                <label>Site</label>
                <input type="text" id="editSite" style="width: 100%;">
            </div>
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" id="editUsername" style="width: 100%;">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="text" id="editSenha" style="width: 100%;">
            </div>
            <button onclick="salvarEdicao()">💾 Salvar Alterações</button>
        </div>
    </div>

    <script>
        // Carregar senhas do localStorage
        let senhas = JSON.parse(localStorage.getItem('senhas')) || [];

        function salvarNoStorage() {
            localStorage.setItem('senhas', JSON.stringify(senhas));
        }

        function gerarSenha() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?';
            let senha = '';
            for (let i = 0; i < 16; i++) {
                senha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('senha').value = senha;
        }

        function mostrarSenha(campo) {
            if (campo.type === 'password') {
                campo.type = 'text';
            } else {
                campo.type = 'password';
            }
        }

        function copiarTexto(texto) {
            navigator.clipboard.writeText(texto);
            alert('Copiado!');
        }

        function renderizar() {
            const busca = document.getElementById('busca').value.toLowerCase();
            const filtradas = senhas.filter(s => 
                s.site.toLowerCase().includes(busca) || 
                s.username.toLowerCase().includes(busca)
            );

            const container = document.getElementById('listaSenhas');
            const statsDiv = document.getElementById('stats');
            
            if (filtradas.length === 0) {
                container.innerHTML = '<div class="vazio">🔒 Nenhuma senha salva. Adicione a primeira acima!</div>';
            } else {
                container.innerHTML = filtradas.map((s, idx) => `
                    <div class="senha-card">
                        <div class="senha-site">🌐 ${escapeHtml(s.site)}</div>
                        <div class="senha-username">👤 ${escapeHtml(s.username)}</div>
                        <div class="senha-senha" id="senha-${idx}">
                            ${'•'.repeat(12)}
                        </div>
                        <div class="senha-acoes">
                            <button class="btn-mostrar" onclick="toggleSenha(${idx}, '${escapeHtml(s.senha).replace(/'/g, "\\'")}')">👁️ Mostrar</button>
                            <button class="btn-copiar" onclick="copiarTexto('${escapeHtml(s.senha).replace(/'/g, "\\'")}')">📋 Copiar</button>
                            <button class="btn-editar" onclick="abrirModal(${senhas.findIndex(orig => orig === s)})">✏️</button>
                            <button class="btn-excluir" onclick="excluirSenha(${senhas.findIndex(orig => orig === s)})">🗑️</button>
                        </div>
                    </div>
                `).join('');
            }

            // Estatísticas
            statsDiv.innerHTML = `
                <div class="stat">📊 Total: <span>${senhas.length}</span></div>
                <div class="stat">🔍 Exibindo: <span>${filtradas.length}</span></div>
            `;
        }

        function toggleSenha(idx, senhaReal) {
            const elemento = document.getElementById(`senha-${idx}`);
            if (elemento.textContent === '•'.repeat(12)) {
                elemento.textContent = senhaReal;
            } else {
                elemento.textContent = '•'.repeat(12);
            }
        }

        function escapeHtml(texto) {
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        function excluirSenha(index) {
            if (confirm('Tem certeza que deseja excluir esta senha?')) {
                senhas.splice(index, 1);
                salvarNoStorage();
                renderizar();
            }
        }

        function abrirModal(index) {
            const s = senhas[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('editSite').value = s.site;
            document.getElementById('editUsername').value = s.username;
            document.getElementById('editSenha').value = s.senha;
            document.getElementById('modal').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function salvarEdicao() {
            const index = parseInt(document.getElementById('editIndex').value);
            senhas[index] = {
                site: document.getElementById('editSite').value,
                username: document.getElementById('editUsername').value,
                senha: document.getElementById('editSenha').value
            };
            salvarNoStorage();
            fecharModal();
            renderizar();
        }

        document.getElementById('formSenha').addEventListener('submit', (e) => {
            e.preventDefault();
            const site = document.getElementById('site').value;
            const username = document.getElementById('username').value;
            const senha = document.getElementById('senha').value;

            if (!site) {
                alert('Digite o nome do site!');
                return;
            }

            senhas.push({ site, username, senha });
            salvarNoStorage();
            
            document.getElementById('site').value = '';
            document.getElementById('username').value = '';
            document.getElementById('senha').value = '';
            
            renderizar();
        });

        document.getElementById('busca').addEventListener('input', () => renderizar());

        renderizar();
    </script>
</body>
</html>
