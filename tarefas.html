<!DOCTYPE html>
<html>
<head>
    <title>Minhas Tarefas</title>
    <style>
        body { font-family: Arial; padding: 50px; background: #0f0f0f; color: white; max-width: 500px; margin: auto; }
        input { padding: 10px; width: 70%; border-radius: 8px; border: none; }
        button { padding: 10px 15px; background: #ff0000; color: white; border: none; border-radius: 8px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { background: #333; margin: 10px 0; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; }
        .feito { text-decoration: line-through; opacity: 0.5; }
        .delete { background: #666; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>📝 Minhas Tarefas</h1>
    <input type="text" id="tarefa" placeholder="Digite uma tarefa...">
    <button onclick="adicionar()">Adicionar</button>
    <ul id="lista"></ul>
    <script>
        let tarefas = JSON.parse(localStorage.getItem('tarefas')) || [];
        
        function renderizar() {
            const lista = document.getElementById('lista');
            lista.innerHTML = '';
            tarefas.forEach((tarefa, index) => {
                lista.innerHTML += `
                    <li>
                        <span class="${tarefa.feito ? 'feito' : ''}" onclick="toggle(${index})">${tarefa.texto}</span>
                        <button class="delete" onclick="deletar(${index})">🗑️</button>
                    </li>
                `;
            });
            localStorage.setItem('tarefas', JSON.stringify(tarefas));
        }
        
        function adicionar() {
            const input = document.getElementById('tarefa');
            if (input.value.trim()) {
                tarefas.push({ texto: input.value, feito: false });
                input.value = '';
                renderizar();
            }
        }
        
        function toggle(index) {
            tarefas[index].feito = !tarefas[index].feito;
            renderizar();
        }
        
        function deletar(index) {
            tarefas.splice(index, 1);
            renderizar();
        }
        
        renderizar();
    </script>
</body>
</html>
